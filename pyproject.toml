[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abb-observability"
version = "0.1.1"
description = "A production-oriented observability and tracing toolkit for AI agents."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Mainak Sen" }
]

license = "MIT"

keywords = [
    "ai",
    "agents",
    "observability",
    "tracing",
    "llm",
    "agentic-ai",
    "debugging",
    "monitoring"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "groq>=0.4",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/Mainak156/AgentBlackBox"
Repository = "https://github.com/Mainak156/AgentBlackBox"
Issues = "https://github.com/Mainak156/AgentBlackBox/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
blackbox = "agent_black_box.cli:main"

[tool.setuptools]
packages = [
    "agent_black_box",
    "agent_black_box.storage",
    "agent_black_box.integrations",
    "agent_black_box.integrations.providers",
    "agent_black_box.security",
    "dashboard",
]

[tool.setuptools.package-data]
agent_black_box = [
    "assets/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]