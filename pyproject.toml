[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-black-box"
version = "0.1.0"
description = "A production-oriented observability and tracing toolkit for AI agents."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "groq>=0.4",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
blackbox = "agent_black_box.cli:main"

[tool.setuptools]
packages = [
    "agent_black_box",
    "agent_black_box.storage",
    "agent_black_box.integrations",
    "agent_black_box.integrations.providers",
    "agent_black_box.security",
    "dashboard",
]

[tool.setuptools.package-data]
agent_black_box = [
    "assets/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]